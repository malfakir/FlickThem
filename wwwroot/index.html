<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlickThem &middot; Admin</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="topbar">
  <h1>FlickThem</h1>
  <button id="logout" class="btn ghost hidden">Log out</button>
</header>
<main>
  <section id="login" class="card hidden">
    <h2>Sign in</h2>
    <form id="login-form">
      <input type="password" id="pin" placeholder="Admin PIN" required autocomplete="current-password">
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    <p id="login-error" class="error hidden"></p>
  </section>

  <section id="admin" class="hidden">
    <div class="card">
      <h2>New share</h2>
      <form id="create-form">
        <input type="text" id="share-name" placeholder="Folder name, e.g. Wedding photos" maxlength="60">
        <button class="btn primary" type="submit">Create share and QR</button>
      </form>
    </div>

    <div class="card">
      <h2>Storage</h2>
      <p id="storage-status" class="muted">Checking\u2026</p>
      <div id="storage-bar-wrap" class="storage-bar-wrap hidden">
        <div id="storage-bar" class="storage-bar"></div>
      </div>
    </div>

    <div class="card">
      <h2>Your shares</h2>
      <ul id="share-list" class="share-list"></ul>
      <p id="share-empty" class="muted">No shares yet. Create your first one above.</p>
    </div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" type="button" onclick="closeModal()">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
